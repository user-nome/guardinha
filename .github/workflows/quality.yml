name: Qualidade

on:
  push:
    branches:
      - ajustes
  pull_request:
    branches:
      - ajustes
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Piso de reprovação do score de mutação (%). Padrão: 65'
        required: false
        default: '65'
        type: string
      mutation_file:
        description: 'Medir só este arquivo de src/ (repete o passo por vírgula)'
        required: false
        type: string
      run_mutation:
        description: 'Rodar também a varredura de mutação'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      min_score:
        description: 'Piso de reprovação do score de mutação (%). Padrão: 65'
        required: false
        default: '65'
        type: string
      mutation_file:
        description: 'Medir só este arquivo de src/ (repete o passo por vírgula)'
        required: false
        default: ''
        type: string
      run_mutation:
        description: 'Rodar também a varredura de mutação'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  qualidade:
    name: Verificar qualidade

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ferramentas de auditoria (binários fora do git; versões fixadas)
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          chmod +x bin/osv-scanner
          tar -xJf /tmp/shellcheck.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          rm -f /tmp/shellcheck.tar.xz
          bin/osv-scanner --version
          bin/shellcheck --version | head -2

      - name: Typecheck + lint + formato + auditoria OSV + shellcheck
        run: npm run check

  cobertura:
    name: Testes e cobertura

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes com cobertura
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary

      - name: Resumo da cobertura na página da execução
        if: always()
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const s = JSON.parse(fs.readFileSync(file, "utf8"));
            const meta = s.total;
            const cell = (m) => meta[m].pct.toFixed(2) + "%";
            const rows = [
              "## Cobertura",
              "",
              "| Linhas | Ramos | Funções | Comandos |",
              "| --- | --- | --- | --- |",
              "| " + cell("lines") + " | " + cell("branches") + " | " + cell("functions")
                + " | " + cell("statements") + " |",
              "",
              "Meta: 100% nos quatro (definida em `vitest.config.mts`).",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n");
          '

      - name: Relatório HTML da cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cobertura-relatorio
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Testes E2E

    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependências de janela
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libgbm1 libasound2t64 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxkbcommon0 libgtk-3-0t64 libxss1 \
            libxtst6 libatspi2.0-0t64 libuuid1 xdg-utils

      - name: Compila o app e o pacote
        run: npm run dist:dir

      - name: E2E do app compilado e do payload do .deb
        run: xvfb-run -a npm run test:e2e

      - name: Instalação real do .deb
        run: |
          set -euo pipefail
          sudo apt-get install -y ./release/guardinha_*.deb
          test -x /opt/Guardinha/guardinha
          test -f /usr/share/polkit-1/actions/com.guardinha.keypass.policy

  mutacao:
    name: Testes de mutação

    if: >-
      github.event_name == 'schedule'
      || inputs.run_mutation
    runs-on: ubuntu-24.04
    concurrency:
      group: mutacao-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Varredura de mutação
        env:
          MIN_SCORE: ${{ inputs.min_score || '90' }}
          MUTATION_FILE: ${{ inputs.mutation_file }}
        run: |
          set -euo pipefail
          args=(--min-score "$MIN_SCORE")
          if [ -n "${MUTATION_FILE:-}" ]; then
            IFS=',' read -ra arquivos <<< "$MUTATION_FILE"
            for arquivo in "${arquivos[@]}"; do
              limpo="${arquivo#"${arquivo%%[![:space:]]*}"}"
              limpo="${limpo%"${limpo##*[![:space:]]}"}"
              [ -n "$limpo" ] && args+=(--file "$limpo")
            done
          fi
          npm run test:mutation -- "${args[@]}"

      - name: Números da varredura na página da execução
        if: always()
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const file = "mutation/results.json";
            if (!fs.existsSync(file)) process.exit(0);
            const results = JSON.parse(fs.readFileSync(file, "utf8")).results ?? [];
            const count = (status) => results.filter((r) => r.status === status).length;
            // `timeout` e `compileError` ficam fora do denominador, que é como
            // o runner calcula o score (ver `score` em `tools/mutation/run.ts`).
            const scored = count("killed") + count("survived");
            const score = scored === 0 ? 0 : (count("killed") / scored) * 100;
            const rows = [
              "## Mutação",
              "",
              "Score: **" + score.toFixed(1) + "%**",
              "",
              "| Mortos | Sobreviventes | Timeout | Erro de compilação |",
              "| --- | --- | --- | --- |",
              "| " + count("killed") + " | " + count("survived") + " | " + count("timeout")
                + " | " + count("compileError") + " |",
              "",
              "A lista completa dos sobreviventes está no artefato `mutacao-relatorio`.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows.join("\n") + "\n");
          '

      - name: Relatório da varredura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutacao-relatorio
          path: mutation/report.md
          retention-days: 30
          if-no-files-found: ignore
