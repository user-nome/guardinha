version: 2.1

# CI do Guardinha no CircleCI.
#
# Este arquivo é o espelho do gate de qualidade do `.github/workflows/quality.yml`:
# os mesmos quatro jobs, com as mesmas ferramentas e as mesmas versões fixadas.
# Ele **não** publica nada: o `.deb`, o repo APT assinado e a Release continuam
# no `publish.yml` do GitHub Actions, que é quem tem os secrets de GPG e o
# histórico de tags. Publicar nos dois lados ao mesmo tempo faria a mesma
# versão subir duas vezes.
#
# Imagem: `cimg/node:24` é a imagem oficial da CircleCI sobre **Ubuntu 24.04**
# com Node 24, o mesmo par do runner `ubuntu-24.04` do GitHub e a mesma série do
# Linux Mint 22.X, que é o alvo de distribuição. O executor `machine` seria uma
# VM mais cara sem mudar o resultado do empacotamento: o `.deb` sai do mesmo
# `dpkg-deb` do Ubuntu 24.04 de qualquer jeito.
#
# Antes da primeira execução: o projeto precisa estar ligado ao CircleCI
# (Settings > Project Setup > Create or Connect a Project) e este `config.yml`
# precisa estar no branch de onde a execução parte. O passo a passo está em
# `docs/build.md`.

parameters:
  run-mutation:
    type: boolean
    default: false
    description: >-
      Dispara a varredura de mutação. Fica desligada por padrão porque a
      varredura completa leva mais de uma hora: no GitHub Actions ela tem ritmo
      próprio (push na `developer`, uma vez por mês e disparo manual).
  min-mutation-score:
    type: string
    default: '65'
    description: >-
      Piso de reprovação do score de mutação (%). O número medido hoje é 69,4%;
      a folga é de propósito, porque o score depende da máquina (mutante que
      estoura o tempo vira `timeout` e sai do denominador).

executors:
  node:
    docker:
      - image: cimg/node:24
    working_directory: ~/project
    environment:
      # O `postinstall` do Electron baixa o binário para este diretório. Fixar o
      # caminho faz o cache do CircleCI ser previsível.
      ELECTRON_CACHE: /home/circleci/.cache/electron
      # A auditoria de dependência do projeto é o OSV Scanner (`npm run
      # security:audit`), não o `npm audit`: o segundo tem base própria e
      # reprovaria com um resultado que ninguém pediu.
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'

commands:
  instalar_dependencias:
    description: 'Restaura o cache, roda o `npm ci` e devolve o cache ao fim.'
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - npm-v1-{{ .Branch }}-
            - npm-v1-
      - run:
          name: Instalar dependências
          command: npm ci
          # O `teardown` roda mesmo com o job vermelho, cancelado ou no limite
          # de tempo: sem ele, uma execução que falha no meio desperdiça o
          # download inteiro e a próxima começa do zero.
          teardown:
            - save_cache:
                key: npm-v1-{{ .Branch }}-{{ checksum "package-lock.json" }}
                paths:
                  - /home/circleci/.npm
                  - /home/circleci/.cache/electron

  baixar_ferramentas_auditoria:
    description: 'Baixa o osv-scanner e o shellcheck, que ficam fora do git.'
    steps:
      - run:
          name: Ferramentas de auditoria (binários fora do git; versões fixadas)
          command: |
            set -euo pipefail
            # `bin/osv-scanner` e `bin/shellcheck` são gitignored (ver
            # `.gitignore`): a pasta não existe no checkout do CI e o curl
            # falharia com exit 23 (não consegue criar o arquivo). `mkdir -p`
            # antes. Mesmas versões do `quality.yml` e de `docs/build.md`.
            mkdir -p bin
            curl -fsSL -o bin/osv-scanner \
              https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
            curl -fsSL -o /tmp/shellcheck.tar.xz \
              https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
            chmod +x bin/osv-scanner
            # O tarball tem shellcheck-v0.11.0/shellcheck; `--strip-components=1`
            # joga o diretório fora e o tarball vai para /tmp (fora da pasta que
            # o `npm run check` lê, para não sobrar lixo no workspace).
            tar -xJf /tmp/shellcheck.tar.xz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
            rm -f /tmp/shellcheck.tar.xz
            bin/osv-scanner --version
            bin/shellcheck --version | head -2

jobs:
  qualidade:
    # 2 vCPU e 4 GB: aqui só rodam tipos, lint, formato, o OSV Scanner e o
    # shellcheck. Nada disso é faminto.
    resource_class: medium
    executor: node
    steps:
      - checkout
      - instalar_dependencias
      - baixar_ferramentas_auditoria
      - run:
          name: Typecheck + lint + formato + auditoria OSV + shellcheck
          command: npm run check

  cobertura:
    # 4 vCPU e 8 GB: a suíte roda Argon2id de verdade (128 MB e 256 MB por
    # derivação) e o Vitest abre um worker por núcleo.
    resource_class: large
    executor: node
    steps:
      - checkout
      - instalar_dependencias
      # Os três reporters vêm na linha de comando porque o Vitest **substitui**
      # a lista do `vitest.config.mts` quando a flag aparece na linha de
      # comando: passar só `json-summary` apagaria a tabela do texto e o
      # relatório HTML.
      - run:
          name: Testes com cobertura
          command: >-
            npm run test:coverage
            -- --coverage.reporter=text
            -- --coverage.reporter=html
            -- --coverage.reporter=json-summary
          no_output_timeout: 15m
      - run:
          name: Resumo da cobertura
          command: |
            set -euo pipefail
            node -e '
              const fs = require("node:fs");
              const file = "coverage/coverage-summary.json";
              if (!fs.existsSync(file)) process.exit(0);
              const s = JSON.parse(fs.readFileSync(file, "utf8"));
              const meta = s.total;
              const cell = (m) => meta[m].pct.toFixed(2) + "%";
              console.log("## Cobertura");
              console.log("");
              console.log("| Linhas | Ramos | Funções | Comandos |");
              console.log("| --- | --- | --- | --- |");
              console.log(
                "| " + cell("lines") + " | " + cell("branches") + " | " + cell("functions")
                  + " | " + cell("statements") + " |",
              );
              console.log("");
              console.log("Meta: 100% nos quatro (definida em `vitest.config.mts`).");
            '
      - store_artifacts:
          path: coverage
          destination: cobertura-relatorio

  e2e:
    # 4 vCPU e 8 GB: aqui roda o empacotamento, o Electron sob `xvfb` e a
    # instalação do `.deb`.
    resource_class: large
    executor: node
    steps:
      - checkout
      - instalar_dependencias
      # O Electron abre uma janela: precisa de display (Xvfb) e das bibliotecas
      # gráficas. `libgtk-3-0t64` e `libatspi2.0-0t64` respondem pelos nomes
      # antigos por `Provides`, que é o que o `.deb` declara. `fakeroot` é o
      # que o electron-builder usa para montar o pacote sem ser root.
      - run:
          name: Dependências de janela
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              xvfb fakeroot libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
              libdrm2 libgbm1 libasound2t64 libxcomposite1 libxdamage1 \
              libxfixes3 libxrandr2 libxkbcommon0 libgtk-3-0t64 libxss1 \
              libxtst6 libatspi2.0-0t64 libuuid1 xdg-utils
      # Um build serve aos dois alvos: `out/` para o compilado e `release/`
      # (`.deb` e árvore descompactada) para o empacotado. O `--publish never`
      # já vem no script `dist:dir` do package.json: sem ele o
      # electron-builder detecta o CI, tentaria publicar sozinho ("Implicit
      # publishing") e morreria sem token.
      - run:
          name: Compila o app e o pacote
          command: npm run dist:dir
      - run:
          name: E2E do app compilado e do payload do .deb
          command: xvfb-run -a npm run test:e2e
          # O teste de auto-lock espera cinco minutos reais de ociosidade, e o
          # teto padrão de silêncio do CircleCI (10 minutos) cairia perto.
          no_output_timeout: 20m
      # O E2E roda sobre o payload extraído do `.deb`: o perfil AppArmor do
      # pacote nega a porta TCP do CDP (ver docs/e2e.md). Aqui o pacote é
      # instalado de verdade, para conferir que resolve as dependências e deixa
      # o binário e a ação do PolicyKit no lugar.
      - run:
          name: Instalação real do .deb
          command: |
            set -euo pipefail
            sudo apt-get install -y ./release/guardinha_*.deb
            test -x /opt/Guardinha/guardinha
            test -f /usr/share/polkit-1/actions/com.guardinha.keypass.policy
      # Só o `.deb` vai como artefato: a árvore descompactada
      # (`release/linux-unpacked/`) pesa centenas de megabytes e não interessa
      # para quem quer instalar o pacote.
      - run:
          name: Guardar o .deb como artefato
          command: |
            set -euo pipefail
            mkdir -p artefatos
            cp release/guardinha_*.deb artefatos/
      - store_artifacts:
          path: artefatos
          destination: pacote

  mutacao:
    # A varredura completa leva mais de uma hora. O plano Free do CircleCI
    # corta o job em 1 h, o Performance em 3 h e o Scale em 5 h: este job
    # precisa de Performance (ou Scale), senão ele morre no meio da varredura
    # e não dá placar nenhum.
    resource_class: large
    executor: node
    steps:
      - checkout
      - instalar_dependencias
      - run:
          name: Varredura de mutação
          command: npm run test:mutation -- --min-score << pipeline.parameters.min-mutation-score >>
          no_output_timeout: 30m
      - store_artifacts:
          path: mutation
          destination: mutacao-relatorio

workflows:
  qualidade:
    jobs:
      # O filtro é o mesmo para os três jobs, e a âncora do YAML evita repetir
      # a expressão. Ele cobre o push nas três branches de trabalho (`main`,
      # `ajustes` e `developer`) e qualquer pull request. O `pipeline.event.name`
      # é o gatilho do evento (push, pull_request, schedule, api): ele é
      # preenchido tanto pela integração moderna (GitHub App) quanto pela antiga
      # (OAuth), então o pull request é detectado nos dois casos.
      - qualidade:
          name: Verificar qualidade
          filters: &gate >-
            pipeline.event.name == "pull_request"
            or pipeline.git.branch == "main"
            or pipeline.git.branch == "ajustes"
            or pipeline.git.branch == "developer"
      - cobertura:
          name: Testes e cobertura
          filters: *gate
      - e2e:
          name: Testes E2E
          filters: *gate

  mutacao:
    # A varredura tem ritmo próprio, como no `quality.yml`: ela roda num push
    # para a `developer`, no disparo manual (parâmetro `run-mutation`) e no
    # disparo mensal.
    #
    # O disparo mensal é um **Schedule Trigger** criado na interface do CircleCI
    # (Project Settings > Triggers > Add Schedule), e não um `triggers:
    # schedule:` no config: workflows agendados não funcionam em projetos
    # ligados pelo GitHub App, que é a integração padrão hoje. O gatilho do
    # agendamento chega como `pipeline.event.name == "schedule"`.
    when: << pipeline.parameters.run-mutation or pipeline.event.name == "schedule" or (pipeline.git.branch == "developer" and pipeline.event.name == "push") >>
    jobs:
      - mutacao:
          name: Testes de mutação
